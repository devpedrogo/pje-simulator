<div class="container">
  <h2>Lista de Processos</h2>

  <div class="table-responsive">
    <!-- Passamos o Observable direto no [dataSource] -->
     <div class="new-post-container">
      <button mat-flat-button class="new-post-button" (click)="openNewProcessoFormDialog()">
        Novo Processo
        <mat-icon>add</mat-icon>
      </button>
    </div>
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z1">

      <!-- Coluna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID Processo </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!-- Coluna Número do Processo -->
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Número </th>
        <td mat-cell *matCellDef="let element"> **{{element.nr_processo}}** </td>
      </ng-container>

      <!-- Coluna Origem -->
      <ng-container matColumnDef="origem">
        <th mat-header-cell *matHeaderCellDef> Origem </th>
        <td mat-cell *matCellDef="let element"> {{element.nr_processo_origem}} </td>
      </ng-container>

      <!-- Coluna Descrição -->
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let element"> {{element.ds_complemento}} </td>
      </ng-container>

      <!-- Coluna Período (Datas combinadas) -->
      <ng-container matColumnDef="datas">
        <th mat-header-cell *matHeaderCellDef> Período </th>
        <td mat-cell *matCellDef="let element">
          {{element.dt_inicio | date:'dd/MM/yyyy'}} - {{element.dt_fim | date:'dd/MM/yyyy'}}
        </td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef>Editar</th>
        <td mat-cell *matCellDef="let processo">
          <button matButton="outlined" (click)="openEditProcessoFormDialog(processo.id)">
            editar
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef>Excluir</th>
        <td mat-cell *matCellDef="let processo">
          <button matButton="elevated" class="btn-excluir" style="background-color: rgb(248, 60, 60); color: white;" (click)="deleteProcesso(processo.id)">
            excluir
          </button>
        </td>
      </ng-container>

      <!-- Declaração das linhas de cabeçalho e dados baseadas no displayedColumns -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
