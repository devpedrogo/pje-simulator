<div class="container">
  <h2>Lista de Processos</h2>

  <div class="table-responsive">
    <!-- Passamos o Observable direto no [dataSource] -->
    <table mat-table [dataSource]="processos" class="mat-elevation-z1">

      <!-- Coluna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id_processo}} </td>
      </ng-container>

      <!-- Coluna Número do Processo -->
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Número </th>
        <td mat-cell *matCellDef="let element"> **{{element.nr_processo}}** </td>
      </ng-container>

      <!-- Coluna Origem -->
      <ng-container matColumnDef="origem">
        <th mat-header-cell *matHeaderCellDef> Origem </th>
        <td mat-cell *matCellDef="let element"> {{element.nr_processo_origem}} </td>
      </ng-container>

      <!-- Coluna Descrição -->
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let element"> {{element.ds_complemento}} </td>
      </ng-container>

      <!-- Coluna Período (Datas combinadas) -->
      <ng-container matColumnDef="datas">
        <th mat-header-cell *matHeaderCellDef> Período </th>
        <td mat-cell *matCellDef="let element">
          {{element.dt_inicio | date:'dd/MM/yyyy'}} - {{element.dt_fim | date:'dd/MM/yyyy'}}
        </td>
      </ng-container>

      <!-- Declaração das linhas de cabeçalho e dados baseadas no displayedColumns -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
